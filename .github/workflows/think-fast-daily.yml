name: THINK FAST DAILY

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"
    - cron: "40 12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  think-fast-daily:
    name: Generate and Upload Quiz Short
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      YOUTUBE_PRIVACY_STATUS: public
      TTS_VOICE: en-US-GuyNeural

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "ERROR: GEMINI_API_KEY is missing."; exit 1; }
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "ERROR: YOUTUBE_OAUTH_JSON is missing."; exit 1; }
          test -n "${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" || { echo "ERROR: INSTAGRAM_ACCESS_TOKEN is missing."; exit 1; }
          test -n "${{ secrets.INSTAGRAM_USER_ID }}" || { echo "ERROR: INSTAGRAM_USER_ID is missing."; exit 1; }
          python - <<'PY'
          import os, json, sys
          try:
              data=json.loads(os.environ["YOUTUBE_OAUTH_JSON"])
          except Exception:
              print("ERROR: YOUTUBE_OAUTH_JSON is invalid JSON."); sys.exit(1)
          missing=[k for k in ["client_id","client_secret","refresh_token"] if not data.get(k)]
          if missing:
              print("ERROR: Missing OAuth fields:", ", ".join(missing)); sys.exit(1)
          print("YouTube OAuth fields: OK")
          PY

      - name: Refresh THINK FAST analytics strategy
        run: |
          echo "======================================"
          echo "REFRESHING AI CONTENT STRATEGY"
          echo "======================================"
          python src/strategy_engine.py
          cat think_fast_strategy.json

      - name: Apply AI-selected posting times
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          python src/update_posting_schedule.py
          if ! git diff --quiet -- .github/workflows/think-fast-daily.yml; then
            test -n "$WORKFLOW_PAT" || { echo "ERROR: WORKFLOW_PAT secret is missing. Add a GitHub PAT with workflow permission."; exit 1; }
            git config user.name "think-fast-daily-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/think-fast-daily.yml
            git commit -m "Update THINK FAST posting schedule from analytics"
            git remote set-url origin "https://x-access-token:${WORKFLOW_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Posting schedule already matches current AI strategy."
          fi

      - name: Inject strategy into quiz generator
        run: |
          python src/strategy_injector.py
          python -m py_compile src/think_fast_daily_generate.py

      - name: Clean previous generated files
        run: |
          rm -rf output
          mkdir -p output

      - name: Generate THINK FAST DAILY Quiz
        shell: bash
        run: |
          set +e
          GENERATOR="src/think_fast_daily_generate.py"
          LOG_FILE="/tmp/think-fast-quiz-generation.log"

          python - <<'PY'
          from pathlib import Path
          p = Path("src/think_fast_daily_generate.py")
          s = p.read_text(encoding="utf-8")
          old = """client = genai.Client(api_key=api_key)"""
          if old in s:
              new = """client = genai.Client(\n    api_key=api_key,\n    http_options=types.HttpOptions(\n        timeout=12000,\n        retry_options=types.HttpRetryOptions(attempts=1)\n    )\n)"""
              s = s.replace(old, new, 1)
          else:
              marker = "client = genai.Client(\n"
              start = s.find(marker)
              if start < 0:
                  raise SystemExit("ERROR: Gemini client initialization not found.")
              end = s.find("\n)\n\nMODEL =", start)
              if end < 0:
                  raise SystemExit("ERROR: Could not locate end of Gemini client initialization.")
              new = """client = genai.Client(\n    api_key=api_key,\n    http_options=types.HttpOptions(\n        timeout=12000,\n        retry_options=types.HttpRetryOptions(attempts=1)\n    )\n)\n"""
              s = s[:start] + new + s[end + 3:]
          p.write_text(s, encoding="utf-8")
          print("Gemini SDK retry policy forced: attempts=1, timeout=12s")
          PY

          sed -i 's/^MAX_GENERATION_ATTEMPTS = 5$/MAX_GENERATION_ATTEMPTS = 1/' "$GENERATOR"
          python -m py_compile "$GENERATOR" || exit 1

          MODELS=(
            "gemini-3.8-flash"
            "gemini-3.7-flash"
            "gemini-3.6-flash"
            "gemini-3.5-flash"
            "gemini-3.5-flash-lite"
            "gemini-3.1-flash-lite"
          )

          AI_SUCCESS=0

          for MODEL in "${MODELS[@]}"; do
            echo "======================================"
            echo "TRYING GEMINI MODEL: $MODEL"
            echo "======================================"
            rm -f "$LOG_FILE"

            GEMINI_MODEL="$MODEL" timeout 20s python "$GENERATOR" >"$LOG_FILE" 2>&1
            STATUS=$?
            cat "$LOG_FILE"

            if [ "$STATUS" -eq 0 ]; then
              echo "SUCCESS: Quiz generated with $MODEL"
              AI_SUCCESS=1
              break
            fi

            if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 137 ]; then
              echo "MODEL UNAVAILABLE/RATE-LIMITED/TIMED OUT: $MODEL"
              echo "Moving immediately to the next Gemini model..."
              continue
            fi

            if grep -Eiq '(^|[^0-9])5(00|02|03|04)([^0-9]|$)|408|429|UNAVAILABLE|DEADLINE_EXCEEDED|deadline[_ ]+exceeded|high demand|RESOURCE_EXHAUSTED|rate.?limit|quota|temporarily unavailable|timed.?out|timeout|model.*not found|not found.*model' "$LOG_FILE"; then
              echo "MODEL UNAVAILABLE/RATE-LIMITED/TIMED OUT: $MODEL"
              echo "Moving immediately to the next Gemini model..."
              continue
            fi

            if grep -Eiq '(^|[^0-9])(401|403)([^0-9]|$)|UNAUTHENTICATED|PERMISSION_DENIED|invalid[_ ]?api[_ ]?key|api[_ ]?key.*invalid|authentication failed' "$LOG_FILE"; then
              echo "FATAL GEMINI AUTHENTICATION/PERMISSION ERROR. Fallback will not help."
              exit "$STATUS"
            fi

            echo "GENERATION FAILED FOR $MODEL WITH A NON-TRANSIENT ERROR."
            exit "$STATUS"
          done

          if [ "$AI_SUCCESS" -eq 0 ]; then
            echo "======================================"
            echo "ALL GEMINI MODELS FAILED"
            echo "STARTING OFFLINE QUIZ FALLBACK"
            echo "======================================"
            python src/local_quiz_fallback.py || {
              echo "ERROR: Offline quiz fallback also failed."
              exit 1
            }
            echo "SUCCESS: Quiz generated locally without Gemini."
          fi

      - name: Check generated frames
        run: |
          FRAME_DIR="output/think_fast_daily_frames"
          test -d "$FRAME_DIR" || { echo "ERROR: Frame directory not found."; find output -maxdepth 3 -type f -print || true; exit 1; }
          FRAME_COUNT=$(find "$FRAME_DIR" -maxdepth 1 -type f -name "frame_*.png" | wc -l)
          echo "Frame count: $FRAME_COUNT"
          test "$FRAME_COUNT" -ge 10 || { echo "ERROR: Too few frames."; find output -maxdepth 3 -type f -print || true; exit 1; }

      - name: Render silent video
        run: |
          FRAME_DIR="output/think_fast_daily_frames"
          FIRST_FRAME=$(find "$FRAME_DIR" -maxdepth 1 -type f -name "frame_*.png" -printf "%f\n" | sort | head -n 1 | sed -E 's/frame_([0-9]+)\.png/\1/')
          test -n "$FIRST_FRAME" || { echo "ERROR: Could not detect first frame."; exit 1; }
          ffmpeg -y -framerate 30 -start_number "$FIRST_FRAME" -i "$FRAME_DIR/frame_%05d.png" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -r 30 -movflags +faststart output/factverse_silent.mp4

      - name: Add natural voice and music
        run: python src/add_audio.py

      - name: Verify final video
        run: |
          test -f output/think_fast_daily.mp4 || { echo "ERROR: Final video missing."; find output -maxdepth 2 -type f -print || true; exit 1; }
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/think_fast_daily.mp4

      - name: Prepare public video
        run: |
          rm -rf pages
          mkdir -p pages
          cp output/think_fast_daily.mp4 pages/think_fast_daily.mp4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Wait for public video
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          VIDEO_URL="${PAGE_URL}think_fast_daily.mp4"
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$VIDEO_URL")
            echo "Attempt $i/12 -> HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "ERROR: GitHub Pages video is not publicly reachable."
          exit 1

      - name: Upload to YouTube
        run: python src/upload_youtube.py

      - name: Upload to Instagram Reel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PAGES_VIDEO_URL: ${{ steps.deployment.outputs.page_url }}
        run: python src/upload_instagram.py

      - name: Save THINK FAST DAILY strategy and question history
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          git config user.name "think-fast-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add think_fast_history.json think_fast_strategy.json
          git diff --cached --quiet || git commit -m "Update THINK FAST DAILY analytics strategy"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: think-fast-daily-video
          path: output/think_fast_daily.mp4
          retention-days: 7

      - name: Save metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: think-fast-daily-metadata
          path: output/metadata.json
          retention-days: 7

      - name: Success
        if: success()
        run: |
          echo "THINK FAST DAILY SUCCESS"
          echo "Analytics -> AI strategy -> dynamic posting time -> quiz -> YouTube + Instagram: COMPLETE"

      - name: Failure report
        if: failure()
        run: |
          echo "THINK FAST DAILY AUTOMATION FAILED"
          find output -maxdepth 3 -type f -print 2>/dev/null || true
