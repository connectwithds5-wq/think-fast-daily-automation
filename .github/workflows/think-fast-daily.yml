name: THINK FAST DAILY
on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  think-fast-daily:

    name: Generate and Upload Quiz Short

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash

      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}

      YOUTUBE_PRIVACY_STATUS: public

      TTS_VOICE: en-US-GuyNeural


    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ============================================
      # PYTHON
      # ============================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: pip


      # ============================================
      # FFMPEG
      # ============================================

      - name: Install FFmpeg

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1


      # ============================================
      # PYTHON DEPENDENCIES
      # ============================================

      - name: Install Python dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================
      # CHECK SECRETS
      # ============================================

      - name: Check secrets

        run: |

          echo "======================================"
          echo "CHECKING THINK FAST DAILY CONFIG"
          echo "======================================"

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            exit 1
          fi

          if [ -z "$YOUTUBE_OAUTH_JSON" ]; then
            echo "ERROR: YOUTUBE_OAUTH_JSON is missing."
            exit 1
          fi

          if [ -z "${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" ]; then
            echo "ERROR: INSTAGRAM_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "${{ secrets.INSTAGRAM_USER_ID }}" ]; then
            echo "ERROR: INSTAGRAM_USER_ID is missing."
            exit 1
          fi

          echo "Gemini API key: OK"
          echo "YouTube OAuth JSON: OK"
          echo "Instagram access token: OK"
          echo "Instagram user ID: OK"


          python - <<'PY'

          import os
          import json
          import sys

          raw = os.environ["YOUTUBE_OAUTH_JSON"]

          try:
              data = json.loads(raw)
          except Exception:
              print("ERROR: YOUTUBE_OAUTH_JSON is invalid JSON.")
              sys.exit(1)

          required = [
              "client_id",
              "client_secret",
              "refresh_token"
          ]

          missing = [
              key
              for key in required
              if not data.get(key)
          ]

          if missing:
              print(
                  "ERROR: Missing OAuth fields:",
                  ", ".join(missing)
              )
              sys.exit(1)

          print("YouTube OAuth fields: OK")

          PY


      # ============================================
      # CLEAN OUTPUT
      # ============================================

      - name: Clean previous generated files

        run: |

          rm -rf output

          mkdir -p output


      # ============================================
      # GENERATE QUIZ
      # ============================================

      - name: Generate THINK FAST DAILY Quiz

        run: |

          echo "======================================"
          echo "GENERATING QUIZ"
          echo "======================================"

          python src/think_fast_daily_generate.py


      # ============================================
      # VERIFY FRAMES
      # ============================================

      - name: Check generated frames

        run: |

          FRAME_DIR="output/think_fast_daily_frames"

          if [ ! -d "$FRAME_DIR" ]; then

            echo "ERROR: Frame directory not found."

            find output \
              -maxdepth 3 \
              -type f \
              -print || true

            exit 1

          fi


          FRAME_COUNT=$(
            find "$FRAME_DIR" \
              -maxdepth 1 \
              -type f \
              -name "frame_*.png" \
              | wc -l
          )


          echo "Frame count: $FRAME_COUNT"


          if [ "$FRAME_COUNT" -lt 10 ]; then

            echo "ERROR: Too few frames."

            exit 1

          fi


          echo "Generated frames: OK"


      # ============================================
      # RENDER VIDEO
      # ============================================

      - name: Render silent video

        run: |

          FRAME_DIR="output/think_fast_daily_frames"


          FIRST_FRAME=$(
            find "$FRAME_DIR" \
              -maxdepth 1 \
              -type f \
              -name "frame_*.png" \
              -printf "%f\n" \
              | sort \
              | head -n 1 \
              | sed -E 's/frame_([0-9]+)\.png/\1/'
          )


          if [ -z "$FIRST_FRAME" ]; then

            echo "ERROR: Could not detect first frame."

            exit 1

          fi


          ffmpeg \
            -y \
            -framerate 30 \
            -start_number "$FIRST_FRAME" \
            -i "$FRAME_DIR/frame_%05d.png" \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -r 30 \
            -movflags +faststart \
            output/factverse_silent.mp4


          ls -lh output/factverse_silent.mp4


      # ============================================
      # AUDIO
      # ============================================

      - name: Add natural voice and music

        run: |

          echo "======================================"
          echo "ADDING VOICE + MUSIC"
          echo "======================================"

          python src/add_audio.py


      # ============================================
      # VERIFY FINAL VIDEO
      # ============================================

      - name: Verify final video

        run: |

          if [ ! -f output/think_fast_daily.mp4 ]; then

            echo "ERROR: Final video missing."

            find output \
              -maxdepth 2 \
              -type f \
              -print || true

            exit 1

          fi


          echo "Final video:"
          ls -lh output/think_fast_daily.mp4


          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/think_fast_daily.mp4


      # ============================================
      # PREPARE GITHUB PAGES
      # ============================================

      - name: Prepare public video

        run: |

          rm -rf pages

          mkdir -p pages


          cp \
            output/think_fast_daily.mp4 \
            pages/think_fast_daily.mp4


          ls -lh pages/


      # ============================================
      # UPLOAD PAGES ARTIFACT
      # ============================================

      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:
          path: pages


      # ============================================
      # DEPLOY PAGES
      # ============================================

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4

        with:
          artifact_name: github-pages


      # ============================================
      # WAIT FOR PAGES
      # ============================================

      - name: Wait for public video

        run: |

          PAGE_URL="${{ steps.deployment.outputs.page_url }}"

          VIDEO_URL="${PAGE_URL}think_fast_daily.mp4"


          echo "Pages URL:"
          echo "$PAGE_URL"

          echo ""
          echo "Video URL:"
          echo "$VIDEO_URL"


          echo ""
          echo "Waiting for public video..."


          SUCCESS=0


          for i in $(seq 1 12); do

            HTTP_STATUS=$(
              curl \
                -L \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                "$VIDEO_URL"
            )


            echo "Attempt $i/12 → HTTP $HTTP_STATUS"


            if [ "$HTTP_STATUS" = "200" ]; then

              SUCCESS=1

              break

            fi


            sleep 10

          done


          if [ "$SUCCESS" != "1" ]; then

            echo "ERROR: GitHub Pages video is not publicly reachable."

            exit 1

          fi


          echo "Public video URL: READY"


      # ============================================
      # YOUTUBE
      # ============================================

      - name: Upload to YouTube

        run: |

          echo "======================================"
          echo "UPLOADING TO YOUTUBE"
          echo "======================================"

          python src/upload_youtube.py


      # ============================================
      # INSTAGRAM REEL
      # ============================================

      - name: Upload to Instagram Reel

        env:

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

          PAGES_VIDEO_URL: ${{ steps.deployment.outputs.page_url }}

        run: |

          echo "======================================"
          echo "UPLOADING TO INSTAGRAM REEL"
          echo "======================================"

          python src/upload_instagram.py


      # ============================================
      # SAVE HISTORY
      # ============================================

      - name: Save quiz history

        run: |

          git config user.name \
            "think-fast-daily-bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add quiz_history.json


          if git diff --cached --quiet; then

            echo "No history changes."

          else

            git commit \
              -m "Update THINK FAST DAILY quiz history"

            git push

          fi


      # ============================================
      # SAVE VIDEO
      # ============================================

      - name: Save video artifact

        uses: actions/upload-artifact@v4

        with:

          name: think-fast-daily-video

          path: output/think_fast_daily.mp4

          retention-days: 7


      # ============================================
      # SAVE METADATA
      # ============================================

      - name: Save metadata artifact

        uses: actions/upload-artifact@v4

        with:

          name: think-fast-daily-metadata

          path: output/metadata.json

          retention-days: 7


      # ============================================
      # SUCCESS
      # ============================================

      - name: Success

        if: success()

        run: |

          echo ""
          echo "======================================"
          echo " THINK FAST DAILY SUCCESS"
          echo "======================================"
          echo ""

          echo "Quiz generated              ✅"
          echo "Frames generated            ✅"
          echo "Video rendered              ✅"
          echo "Voice + music               ✅"
          echo "Video verified              ✅"
          echo "GitHub Pages                ✅"
          echo "YouTube upload              ✅"
          echo "Instagram Reel upload      ✅"
          echo "Quiz history                ✅"

          echo ""
          echo "======================================"


      # ============================================
      # FAILURE REPORT
      # ============================================

      - name: Failure report

        if: failure()

        run: |

          echo ""
          echo "======================================"
          echo " THINK FAST DAILY AUTOMATION FAILED"
          echo "======================================"

          echo ""

          echo "Check the failed step above."

          echo ""

          echo "Current output directory:"

          find output \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true

          echo ""

          echo "======================================"
